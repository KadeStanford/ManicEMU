name: Original core runtime capability probe
on:
  push:
    branches: [recovery/dual-airplay-azahar]
    paths: ['OriginalCoreRepair/Tests/**', '.github/workflows/original-core-runtime-probe.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  original-simulator:
    runs-on: macos-15
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with: {lfs: false, submodules: false}
      - name: Compile integrated game diagnostic frontend
        run: |
          sdk="$(xcrun --sdk iphonesimulator --show-sdk-path)"
          mkdir -p OriginalCoreRepair/Tests/build-probe
          xcrun --sdk iphonesimulator clang -target arm64-apple-ios15.0-simulator -isysroot "$sdk" \
            -fobjc-arc -Wall -Werror OriginalCoreRepair/Tests/simulator_game_probe.m \
            -framework UIKit -framework Foundation -o OriginalCoreRepair/Tests/build-probe/GameProbe
      - name: Probe original core with untouched code on simulator
        run: bash OriginalCoreRepair/Tests/simulator-probe.sh
      - name: Verify native fault recorder independent of Apple report quota
        run: bash OriginalCoreRepair/Tests/simulator-game-probe.sh --self-test
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: original-core-runtime-probe-evidence
          path: |
            OriginalCoreRepair/Tests/build-probe/probe.json
            OriginalCoreRepair/Tests/build-probe/probe.log
            OriginalCoreRepair/Tests/build-probe/fault-recorder-self-test.json
