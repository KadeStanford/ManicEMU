name: FastInterp data-path corrective core and integration
on:
  workflow_dispatch:
    inputs:
      target:
        description: Required target to build
        type: choice
        options: [both, ios, native]
        default: both
permissions:
  contents: read
jobs:
  corrective:
    strategy:
      fail-fast: false
      matrix:
        target: ${{ fromJSON(inputs.target == 'ios' && '["ios"]' || inputs.target == 'native' && '["native"]' || '["ios","native"]') }}
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with: {path: manic-source, lfs: false, submodules: false}
      - uses: actions/checkout@v4
        with:
          repository: azahar-emu/azahar
          ref: 98932aeeb7d81ba08715a3e6eff57d47c2d1a65d
          path: azahar-source
          lfs: false
          submodules: recursive
      - name: Build corrected core and run target integration gates
        run: python3 manic-source/FastInterp/Tests/corrective_ci.py --target ${{ matrix.target }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: fastinterp-corrective-${{ github.run_id }}-${{ matrix.target }}
          path: deliverables/
          retention-days: 1
