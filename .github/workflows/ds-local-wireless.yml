name: DS local wireless candidate
on:
  push:
    branches: [feature/ds-local-wireless, fix/ds-v010-delivery-pacing, test/ds-ip-metadata-probe]
    paths: ['DSLink/**', '.github/workflows/ds-local-wireless.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ds-local-${{ github.ref }}
  cancel-in-progress: true
jobs:
  desktop-protocol:
    if: github.ref != 'refs/heads/test/ds-ip-metadata-probe'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with: {lfs: false, submodules: false}
      - name: Prepare pinned public engine for actual native boundary checks
        run: |
          git -c core.autocrlf=false clone --depth 1 --branch v1.3.1 https://github.com/JesseTG/melonds-ds.git ds-protocol-source
          python3 DSLink/scripts/patch_source.py ds-protocol-source
      - name: Build independent peers with sanitizers
        run: >-
          cmake -S DSLink -B ds-protocol-build -DCMAKE_CXX_COMPILER=clang++
          -DCMAKE_BUILD_TYPE=Debug
          -DMANIC_DS_NATIVE_SOURCE=$PWD/ds-protocol-source
          -DCMAKE_CXX_FLAGS='-fsanitize=address,undefined -fno-omit-frame-pointer'
          -DCMAKE_EXE_LINKER_FLAGS='-fsanitize=address,undefined'
      - run: cmake --build ds-protocol-build --parallel 2
      - run: ctest --test-dir ds-protocol-build --output-on-failure
        env: {UBSAN_OPTIONS: 'halt_on_error=1:print_stacktrace=1'}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: DS-protocol-evidence
          path: |
            ds-protocol-build/protocol.json
            ds-protocol-build/Testing/Temporary/LastTest.log
            ds-protocol-build/native_wait_functions.json
  ios-core:
    if: github.ref != 'refs/heads/test/ds-ip-metadata-probe'
    runs-on: macos-15
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with: {lfs: false, submodules: false}
      - name: Build unsigned physical iOS DS core and bridge
        run: bash DSLink/scripts/build-ios.sh
      - name: Check physical iOS Mach-O metadata
        run: |
          python3 - <<'PY'
          import pathlib,sys
          sys.path.insert(0,'GBLink/scripts')
          import ipa_link
          for name in ('DSOriginal','melondsds.libretro'):
              path=pathlib.Path('DSLink/build')/(name+'.framework')/name
              info=ipa_link.inspect_slice(path.read_bytes())
              assert info['platform']==2 and info['filetype']==6 and not info['encrypted']
              assert all(p.startswith(('/usr/lib/','/System/Library/')) for p in info['load_paths'])
              print(name,info)
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: DS-iOS-unsigned
          path: |
            DSLink/build/*.framework
            DSLink/build/build-manifest.json
  ios-simulator:
    runs-on: macos-15
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with: {lfs: false, submodules: false}
      - name: Verify bridge callbacks, checkpoints and session lifecycle
        run: bash DSLink/scripts/simulator-smoke.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: DS-simulator-evidence
          path: DSLink/build-simulator/smoke.json
  windows-engine:
    if: github.ref != 'refs/heads/test/ds-ip-metadata-probe'
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with: {lfs: false, submodules: false}
      - uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          install: mingw-w64-x86_64-gcc mingw-w64-x86_64-cmake mingw-w64-x86_64-ninja mingw-w64-x86_64-python git
      - name: Build reset-capable desktop engine for private local testing
        shell: msys2 {0}
        run: |
          git -c core.autocrlf=false clone --depth 1 --branch v1.3.1 https://github.com/JesseTG/melonds-ds.git ds-windows-source
          python DSLink/scripts/patch_source.py ds-windows-source
          cmake -S ds-windows-source -B ds-windows-build -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_POLICY_VERSION_MINIMUM=3.5 -DENABLE_JIT=OFF -DENABLE_OPENGL=OFF -DENABLE_LTO=OFF -DENABLE_LTO_RELEASE=OFF -DBUILD_AS_SHARED_LIBRARY=ON
          cmake --build ds-windows-build --parallel 3
      - uses: actions/upload-artifact@v4
        with:
          name: DS-Windows-public-source-engine
          path: ds-windows-build/src/libretro/melondsds_libretro.dll
