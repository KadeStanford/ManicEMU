name: Isolated Azahar interpreter diagnostic component
on:
  push:
    branches: [recovery/azahar-interpreter-diagnostic-20261005]
    paths:
      - 'OriginalCoreRepair/StabilityDiagnostics/**'
      - '.github/workflows/azahar-interpreter-diagnostic.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  component:
    runs-on: macos-15
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with: {lfs: false, submodules: false}
      - run: bash OriginalCoreRepair/StabilityDiagnostics/build.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: isolated-azahar-interpreter-component
          path: |
            OriginalCoreRepair/StabilityDiagnostics/build/ManicAzaharStabilityRecorder.framework
            OriginalCoreRepair/StabilityDiagnostics/build/component-manifest.json
            OriginalCoreRepair/StabilityDiagnostics/build/native-self-test/self-test.json
            OriginalCoreRepair/StabilityDiagnostics/build/native-self-test/metadata-self-test.json
