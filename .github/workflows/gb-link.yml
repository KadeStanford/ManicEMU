name: In-game GBA Trade
on:
  push:
    branches: [feature/gb-local-link]
    paths: ['TradeLink/**', 'GBLink/scripts/ipa_link.py', '.github/workflows/gb-link.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  gba-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {lfs: false, submodules: false}
      - name: Build with sanitizers
        run: >-
          cmake -S TradeLink -B build-trade -DCMAKE_C_COMPILER=clang -DCMAKE_CXX_COMPILER=clang++
          -DCMAKE_BUILD_TYPE=Debug
          -DCMAKE_C_FLAGS='-fsanitize=address,undefined -fno-omit-frame-pointer'
          -DCMAKE_EXE_LINKER_FLAGS='-fsanitize=address,undefined'
      - run: cmake --build build-trade --parallel 2
      - run: ctest --test-dir build-trade --output-on-failure
      - run: python3 -m unittest discover -s GBLink/Tests -p 'test_*.py' -v
  ios-library:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with: {lfs: false, submodules: false}
      - run: bash TradeLink/scripts/build-ios.sh
      - name: Check built library packaging metadata
        run: |
          python3 -c "import sys; sys.path.insert(0,'GBLink/scripts'); import ipa_link; [print(ipa_link.inspect_slice(open('TradeLink/build/'+n+'.framework/'+n,'rb').read())) for n in ['ManicGBLink','gpsp.libretro']]"
      - uses: actions/upload-artifact@v4
        with:
          name: ManicGBA-Trade-unsigned
          path: TradeLink/build/*.framework
