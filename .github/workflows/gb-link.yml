name: In-game GBA Link
on:
  push:
    branches: [feature/gb-local-link]
    paths: ['TradeLink/**', 'GBLink/scripts/ipa_link.py', '.github/workflows/gb-link.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  gba-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {lfs: false, submodules: false}
      - name: Build with sanitizers
        run: >-
          cmake -S TradeLink -B build-trade -DCMAKE_C_COMPILER=clang -DCMAKE_CXX_COMPILER=clang++
          -DCMAKE_BUILD_TYPE=Debug
          -DCMAKE_C_FLAGS='-fsanitize=address,undefined -fno-omit-frame-pointer'
          -DCMAKE_EXE_LINKER_FLAGS='-fsanitize=address,undefined'
      - run: cmake --build build-trade --parallel 2
      - run: ctest --test-dir build-trade --output-on-failure
        env: {UBSAN_OPTIONS: 'halt_on_error=1:print_stacktrace=1'}
      - run: python3 -m unittest discover -s GBLink/Tests -p 'test_*.py' -v
      - name: Read official mGBA source for cross-core battery check
        uses: actions/checkout@v4
        with:
          repository: mgba-emu/mgba
          ref: c3c8e5e813f245028de118a56734e1dc0f35ce2a
          path: build-mgba-source
          lfs: false
          submodules: false
      - name: Build reference mGBA libretro core
        run: |
          cmake -S build-mgba-source -B build-mgba -DBUILD_LIBRETRO=ON -DBUILD_QT=OFF -DBUILD_SDL=OFF -DBUILD_SHARED=OFF -DBUILD_STATIC=OFF -DDISABLE_DEPS=ON
          cmake --build build-mgba --parallel 2
      - name: Verify mGBA battery preservation and state incompatibility
        run: python3 TradeLink/Tests/save_migrate.py build-trade/save_migrate build-mgba/mgba_libretro.so build-trade/libgpsp.so
  ios-library:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with: {lfs: false, submodules: false}
      - run: bash TradeLink/scripts/build-ios.sh
      - name: Check built library packaging metadata
        run: |
          python3 -c "import sys; sys.path.insert(0,'GBLink/scripts'); import ipa_link; [print(ipa_link.inspect_slice(open('TradeLink/build/'+n+'.framework/'+n,'rb').read())) for n in ['ManicGBLink','gpsp.libretro']]"
      - uses: actions/upload-artifact@v4
        with:
          name: ManicGBA-Trade-unsigned
          path: TradeLink/build/*.framework
      - name: Verify native in-game discovery UI in iOS simulator
        run: bash TradeLink/scripts/simulator-smoke.sh
      - uses: actions/upload-artifact@v4
        with:
          name: GBA-Trade-UI-smoke
          path: |
            TradeLink/build-simulator/smoke.json
            TradeLink/build-simulator/latency.json
            TradeLink/build-simulator/gba-trade-ui.png
